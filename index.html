<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>She's coming Home ❤️</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at top, #3a1830 0%, #170b18 45%, #080509 100%);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    .container {
      width: 100%;
      max-width: 850px;
      padding: 35px 20px;
      text-align: center;
      position: relative;
      z-index: 1;
    }

    @keyframes sparkleAround {
      0%, 100% {
        opacity: 0;
      }
      50% {
        opacity: 1;
      }
    }

    .heart {
      font-size: 65px;
      animation: heartbeat 1.6s infinite;
      margin-bottom: 20px;
      position: relative;
      display: inline-block;
    }

    .heart::after {
      content: "✨";
      position: absolute;
      top: -12px;
      right: -12px;
      font-size: 16px;
      animation: sparkleAround 0.6s ease-in-out 4 forwards;
    }

    .small {
      color: #d8b7ce;
      font-size: 14px;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 12px;
      position: relative;
    }

    @keyframes textColorPulse {
      0%, 100% {
        color: #ffffff;
      }
      50% {
        color: #ff6ba6;
      }
    }

    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      15% { transform: scale(1.15); }
      30% { transform: scale(1); }
      45% { transform: scale(1.1); }
    }

    h1 {
      font-family: "Dancing Script", "Brush Script MT", cursive, -apple-system, sans-serif;
      font-weight: 700;
      font-size: clamp(48px, 10vw, 92px);
      line-height: 1.05;
      margin-top: 30px;
      margin-bottom: 15px;
      animation: textColorPulse 2s ease-in-out infinite;
    }

    .date {
      color: #f5b9d9;
      font-size: 20px;
      margin-bottom: 35px;
    }

    .route {
      color: #c9aebe;
      font-size: 16px;
      letter-spacing: 1px;
      margin-top: 12px;
    }

    .countdown {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      margin: 30px auto;
    }

    @keyframes borderPulse {
      0%, 100% {
        border-color: #f5b9d9;
        box-shadow: 0 0 8px rgba(245, 185, 217, 0.3);
      }
      50% {
        border-color: #ff6ba6;
        box-shadow: 0 0 15px rgba(255, 107, 166, 0.4);
      }
    }

    .box {
      background: rgba(255,255,255,0.07);
      border: 2px solid #f5b9d9;
      border-radius: 22px;
      padding: 25px 10px;
      backdrop-filter: blur(10px);
    }

    .number {
      font-size: clamp(34px, 7vw, 60px);
      font-weight: 700;
      letter-spacing: -2px;
    }

    .label {
      margin-top: 7px;
      color: #c9aebe;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .message {
      margin: 35px auto 0;
      max-width: 650px;
      color: #e8d5e2;
      font-size: 18px;
      line-height: 1.7;
    }

    .days-left {
      margin-top: 25px;
      font-size: 15px;
      color: #bda4b5;
    }

    .footer {
      margin-top: 45px;
      color: #8e7485;
      font-size: 13px;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(0) rotate(0deg);
        opacity: 0;
      }
      15% {
        opacity: .7;
      }
      85% {
        opacity: .4;
      }
      100% {
        transform: translateY(-110vh) rotate(25deg);
        opacity: 0;
      }
    }

    .floating-heart {
      position: fixed;
      bottom: -5vh;
      color: #ff6ba6;
      pointer-events: none;
      z-index: 0;
      animation-name: floatUp;
      animation-timing-function: linear;
      animation-fill-mode: forwards;
    }

    @media (max-width: 600px) {
      .countdown {
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
      }

      .box {
        padding: 22px 8px;
      }

      .message {
        font-size: 16px;
      }

      .plane {
        font-size: 20px;
      }
    }

    @keyframes flyAcross {
      0% {
        transform: translateX(-10vw) rotate(0deg);
        opacity: 0;
      }
      8% {
        opacity: 1;
      }
      92% {
        opacity: 1;
      }
      100% {
        transform: translateX(110vw) rotate(0deg);
        opacity: 0;
      }
    }

    .plane {
      position: fixed;
      top: 3%;
      left: 0;
      font-size: 26px;
      z-index: 0;
      pointer-events: none;
      animation: flyAcross 14s linear infinite;
      filter: drop-shadow(0 0 6px rgba(255, 182, 217, 0.5));
      display: inline-block;
    }

    .plane::before {
      content: "";
      position: absolute;
      top: 50%;
      right: 100%;
      width: 90px;
      height: 1px;
      background: linear-gradient(to left, rgba(245, 185, 217, 0.6), transparent);
      transform: translateY(-50%);
    }
  </style>
</head>

<body>

  <div class="plane">✈️</div>

  <div class="container">

    <div class="heart">❤️</div>

    <div class="small">Counting down to</div>

    <h1>Until I See You</h1>

    <div class="date">December 12, 2026</div>

    <div class="countdown">
      <div class="box">
        <div class="number" id="days">0</div>
        <div class="label">Days</div>
      </div>

      <div class="box">
        <div class="number" id="hours">00</div>
        <div class="label">Hours</div>
      </div>

      <div class="box">
        <div class="number" id="minutes">00</div>
        <div class="label">Minutes</div>
      </div>

      <div class="box">
        <div class="number" id="seconds">00</div>
        <div class="label">Seconds</div>
      </div>
    </div>

    <div class="message">
      Every day that passes is one day closer to being together again. ❤️
      <br>
      <strong>Can't wait for December 12.</strong>
    </div>

    <div class="days-left" id="daysText"></div>
    <div class="route">Denton ✈️ Hyderabad</div>

    <div class="footer">
      Made with ❤️ for Bindu Maneesha
    </div>

  </div>

  <script>
    const targetDate = new Date("December 12, 2026 00:00:00").getTime();

    function updateCountdown() {
      const now = new Date().getTime();
      const difference = targetDate - now;

      if (difference <= 0) {
        document.getElementById("days").textContent = "0";
        document.getElementById("hours").textContent = "00";
        document.getElementById("minutes").textContent = "00";
        document.getElementById("seconds").textContent = "00";
        document.getElementById("daysText").textContent = "Today is the day. ❤️";
        return;
      }

      const days = Math.floor(difference / (1000 * 60 * 60 * 24));
      const hours = Math.floor(
        (difference / (1000 * 60 * 60)) % 24
      );
      const minutes = Math.floor(
        (difference / (1000 * 60)) % 60
      );
      const seconds = Math.floor(
        (difference / 1000) % 60
      );

      document.getElementById("days").textContent = days;
      document.getElementById("hours").textContent =
        String(hours).padStart(2, "0");
      document.getElementById("minutes").textContent =
        String(minutes).padStart(2, "0");
      document.getElementById("seconds").textContent =
        String(seconds).padStart(2, "0");

      document.getElementById("daysText").textContent =
        days === 1
          ? "Just 1 more day ❤️"
          : days + " days until December 12 ❤️";
    }

    updateCountdown();
    setInterval(updateCountdown, 1000);

    function createHeart() {
      const heart = document.createElement("div");
      heart.className = "floating-heart";
      heart.textContent = "♥";
      heart.style.left = Math.random() * 100 + "vw";
      heart.style.animationDuration = (6 + Math.random() * 5) + "s";
      heart.style.fontSize = (12 + Math.random() * 18) + "px";

      document.body.appendChild(heart);

      setTimeout(() => {
        heart.remove();
      }, 11000);
    }

    setInterval(createHeart, 1800);
  </script>

</body>
</html>
